name: Patientor API Tests

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install patientor backend dependencies
        working-directory: ./patientor/backend
        run: pnpm install

      - name: Lint patientor backend
        working-directory: ./patientor/backend
        run: pnpm run lint

      - name: Start patientor backend server
        working-directory: ./patientor/backend
        run: |
          pnpm start &
          echo $! > server.pid
          sleep 3

      - name: Install test dependencies
        working-directory: ./patientor-api-tests
        run: pnpm install

      - name: Install Playwright browsers
        working-directory: ./patientor-api-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run API tests
        working-directory: ./patientor-api-tests
        run: pnpm test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: patientor-api-tests/playwright-report/
          retention-days: 30

      - name: Stop patientor backend server
        if: always()
        working-directory: ./patientor/backend
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
